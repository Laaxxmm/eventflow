name: Tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_EXTENSIONS: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, sqlite, pdo_sqlite, gd, intl, bcmath

jobs:
  lint:
    name: Pint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Every PHP file a PR (or a push) adds or changes must be Pint-clean.
      - name: Pint (changed files)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          ./vendor/bin/pint --test --diff="$base"

      # Whole repo, reported but not blocking until older files are formatted.
      - name: Pint (whole repo, report only)
        continue-on-error: true
        run: ./vendor/bin/pint --test

  tests:
    name: PHP ${{ matrix.php }} / MySQL 8.4
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Real env vars win over phpunit.xml's sqlite defaults.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate event YAML
        run: php artisan events:validate

      - name: Execute tests
        run: php artisan test

      - name: Smoke test (register -> webhook -> pass mail -> check-in)
        run: php artisan test tests/Smoke

  docker:
    name: Docker image + staging stack
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Boots deploy/compose.prod.yml exactly as on a VPS (Caddy on https://localhost
      # with its internal CA), then runs the HTTP smoke check and a backup/restore.
      - name: Configure deploy/.env for CI
        run: |
          sed -e "s/CHANGE_ME/ci$(openssl rand -hex 8)/g" \
              -e "s|^APP_DOMAIN=.*|APP_DOMAIN=localhost|" \
              -e "s|^APP_URL=.*|APP_URL=https://localhost|" \
              -e "s|^APP_ENV=.*|APP_ENV=staging|" \
              -e "s|^EVENTFLOW_IMAGE=.*|EVENTFLOW_IMAGE=eventflow:ci|" \
              -e "s|^BACKUP_DEST=.*|BACKUP_DEST=/tmp/backups|" \
              deploy/env.example > deploy/.env

      - name: Build and deploy
        env:
          INSECURE: '1'
        run: deploy/deploy.sh --build

      - name: Backup and restore test
        run: |
          docker compose -f deploy/compose.prod.yml exec -T backup bash -c 'backup.sh && restore-test.sh'

      - name: Queue worker and scheduler are running
        run: |
          docker compose -f deploy/compose.prod.yml ps --status running --services | tee /tmp/running
          for s in caddy app queue scheduler mysql backup mailpit; do grep -qx "$s" /tmp/running || { echo "$s is not running"; exit 1; }; done

      # CONTAINER_ROLE=all (Railway): web + queue + scheduler in one container.
      - name: All-in-one role serves /up and runs the worker and scheduler
        run: |
          docker compose -f deploy/compose.prod.yml run -d --name ef-all -e CONTAINER_ROLE=all -e RUN_MIGRATIONS=0 app
          for i in $(seq 1 30); do docker exec ef-all wget -qO- http://127.0.0.1:8080/up >/dev/null 2>&1 && break; sleep 2; done
          docker exec ef-all wget -qO- http://127.0.0.1:8080/up >/dev/null
          sleep 3
          docker exec ef-all ps -o args | tee /tmp/all-ps
          grep -q 'queue:work' /tmp/all-ps && grep -q 'schedule:work' /tmp/all-ps && grep -q 'php-fpm' /tmp/all-ps
          docker rm -f ef-all

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose.prod.yml logs --tail 100
          docker logs ef-all --tail 100 || true

  publish:
    name: Publish image
    needs: [tests, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy staging
    needs: publish
    # Set repository variable STAGING_HOST (and secrets STAGING_SSH_KEY, STAGING_USER) to enable.
    if: vars.STAGING_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_HOST }}
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_USER: ${{ secrets.STAGING_USER }}
          HOST: ${{ vars.STAGING_HOST }}
          APP_DIR: ${{ vars.STAGING_APP_DIR || '~/eventflow' }}
        run: |
          install -m 600 /dev/null ~/key && printf '%s\n' "$SSH_KEY" > ~/key
          ssh -i ~/key -o StrictHostKeyChecking=accept-new "${SSH_USER}@${HOST}" \
            "cd ${APP_DIR} && git pull --ff-only && deploy/deploy.sh"
