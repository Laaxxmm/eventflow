user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_max_body_size 12m;

    # A proxy terminates TLS in front of this container: Caddy on the private
    # Docker network, or Railway's edge (100.64.0.0/10, fd00::/8).
    # Trust its X-Forwarded-* so Laravel sees the client IP (rate limits) and
    # HTTPS (secure URLs and cookies) without touching bootstrap/app.php.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from fd00::/8;
    real_ip_header X-Forwarded-For;

    map $http_x_forwarded_proto $forwarded_https {
        https on;
        default off;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Keep file handles for static files (build assets, images, uploads) hot.
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;

    server {
        listen 8080 default_server;
        root /var/www/html/public;
        index index.php;

        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Organiser uploads: every file gets a random, never-reused name.
        location /storage/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        # Stock photos and template thumbnails: may be replaced in place, so a week.
        location /images/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        location = /favicon.ico {
            expires 7d;
            access_log off;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $forwarded_https;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
