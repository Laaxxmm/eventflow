# Cycling pack defaults. Mass start, so no race_sheet; add one per event for criteriums.
sport: cycling
label: Cycling
template: midnight
distances:
  - { code: 25K, label: 25 km ride }
  - { code: 50K, label: 50 km ride }
  - { code: 100K, label: 100 km (century) }
age_bands:
  - { label: Junior, min: 14, max: 17 }
  - { label: Open, min: 18, max: 39 }
  - { label: Masters, min: 40, max: 99 }
fields:
  - { key: age, label: Age, type: number, required: true }
  - { key: gender, label: Gender, type: select, required: true, options: [Male, Female, Other] }
  - { key: bike_type, label: Bike type, type: select, required: true, options: [Road, MTB, Hybrid, Other] }
  - { key: helmet, label: I will wear a helmet throughout the ride, type: checkbox, required: true, options: ["Yes"] }
  - { key: emergency_contact_name, label: Emergency contact name, type: text, required: true }
  - { key: emergency_contact_phone, label: Emergency contact phone, type: tel, required: true }
certificate:
  template: velocity
  orientation: landscape
faq:
  - q: Is a helmet compulsory?
    a: Yes. No helmet, no start. Bring a working front and rear light for early starts.
  - q: When will I get my pass?
    a: Your EF- pass (PNG + PDF) is emailed as soon as payment is confirmed.
  - q: Are there feed stations?
    a: Water and feed points are marked on the route map shared before the ride.
