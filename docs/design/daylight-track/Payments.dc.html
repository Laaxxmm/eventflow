<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payments settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F5FA}
a{color:#4B3FE0}a:hover{color:#2B2390}
.d{font-family:'Archivo',Inter,system-ui,sans-serif;font-variation-settings:'wdth' 118;font-weight:800;letter-spacing:-0.02em}
.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.f input{font:inherit;font-weight:400;font-size:15px;padding:13px 14px;border-radius:14px;border:1px solid #C5CBDB;background:#FFFFFF;color:#121A33}
.hint{font-size:13px;font-weight:400;color:#4A5372}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1300px; background: #F3F5FA; font-family: Inter, system-ui, sans-serif; color: #121A33">
<div style="flex: 0 0 248px; display: flex"><dc-import name="Sidebar" active="payments" hint-size="248px,1300px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 22px; max-width: 980px">
<h1 class="d" style="margin: 0; font-size: 40px">Payments</h1>

<section style="background: #E3F4EE; border-radius: 24px; padding: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 18px">
<span aria-hidden="true" style="width: 48px; height: 48px; flex: none; border-radius: 999px; background: #1E7A5C; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg></span>
<div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px; color: #0B4A38">Entry fees go straight to your Razorpay account</strong><span style="font-size: 14px; color: #2D5A4C">Live mode. Connection checked 2 hours ago.</span></div>
<a href="#test" style="background: #FFFFFF; color: #0B4A38; text-decoration: none; padding: 11px 18px; border-radius: 999px; font-weight: 700; font-size: 14px">Test connection</a>
</section>

<div role="radiogroup" aria-label="Payment provider" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px">
<label style="cursor: pointer; background: #FFFFFF; border: 2px solid #4B3FE0; border-radius: 22px; padding: 20px; display: flex; align-items: center; gap: 14px"><input type="radio" name="prov" checked="" style="width: 20px; height: 20px; accent-color: #4B3FE0"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 16px">Razorpay</strong><span style="font-size: 13px; color: #4A5372">UPI, cards, netbanking</span></span><span style="font-size: 12px; font-weight: 700; background: #ECEAFF; color: #2B2390; padding: 5px 10px; border-radius: 999px">In use</span></label>
<label style="cursor: pointer; background: #FFFFFF; border: 2px solid transparent; border-radius: 22px; padding: 20px; display: flex; align-items: center; gap: 14px"><input type="radio" name="prov" style="width: 20px; height: 20px; accent-color: #4B3FE0"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 16px">Cashfree</strong><span style="font-size: 13px; color: #4A5372">UPI, cards, netbanking</span></span><span style="font-size: 12px; font-weight: 600; color: #4A5372">Not set up</span></label>
</div>

<section style="background: #FFFFFF; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<h2 style="margin: 0; font-size: 20px">Razorpay keys</h2>
<div role="group" aria-label="Mode" style="display: flex; background: #F3F5FA; border-radius: 999px; padding: 4px"><button type="button" aria-pressed="false" style="font: inherit; cursor: pointer; border: 0; background: transparent; padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; color: #121A33">Test (sandbox)</button><button type="button" aria-pressed="true" style="font: inherit; cursor: pointer; border: 0; background: #121A33; color: #FFFFFF; padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600">Live</button></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<label class="f">Key ID<input type="text" value="rzp_live_8Hq2••••••••"></label>
<label class="f">Key secret<input type="password" placeholder="Saved ••••7Kd2. Leave empty to keep it."></label>
</div>
<label class="f">Webhook secret<input type="password" placeholder="Saved ••••91Qa. Leave empty to keep it."><span class="hint">Razorpay uses this to prove a payment message really came from them.</span></label>
<div style="background: #F3F5FA; border-radius: 18px; padding: 16px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><strong style="font-size: 14px">Webhook URL to paste into Razorpay</strong><code style="font-size: 13px; color: #3B4463; word-break: break-all">https://eventflow.in/webhooks/razorpay/demo-runners</code></span>
<button type="button" style="font: inherit; cursor: pointer; border: 1px solid #C5CBDB; background: #FFFFFF; color: #121A33; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px">Copy</button>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; border-top: 1px solid #EEF0F6; padding-top: 18px">
<button type="button" style="font: inherit; cursor: pointer; border: 1px solid #C5CBDB; background: #FFFFFF; color: #121A33; padding: 13px 20px; border-radius: 999px; font-weight: 600">Test connection</button>
<button type="button" style="font: inherit; cursor: pointer; border: 0; background: #4B3FE0; color: #FFFFFF; padding: 14px 22px; border-radius: 999px; font-weight: 700">Save and use Razorpay</button>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
