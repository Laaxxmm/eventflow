<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EventFlow app sidebar</title>

body{margin:0}

</helmet>

<a href="Dashboard.dc.html" style="padding: 0 8px; text-decoration: none; color: #121A33; font-family: 'Archivo', Inter, sans-serif; font-variation-settings: 'wdth' 118; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">EventFlow</a>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: #F3F5FA">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #4B3FE0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">DR</span>
<span style="display: flex; flex-direction: column; min-width: 0"><strong style="font-size: 14px">Demo Runners</strong><span style="font-size: 12px; color: #4A5372">Club Season, 3 of 5 races</span></span>
</div>
<a href="Wizard.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #4B3FE0; color: #FFFFFF; text-decoration: none; padding: 13px; border-radius: 999px; font-weight: 700; font-size: 15px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New event</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{ main }}" as="it" hint-placeholder-count="6">
<a href="{{ it.href }}" aria-current="{{ it.current }}" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; text-decoration: none; font-size: 15px; font-weight: {{ it.weight }}; background: {{ it.bg }}; color: {{ it.ink }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ it.ink }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.icon }}"></path></svg>{{ it.label }}</a>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="padding: 0 12px 6px; font-size: 13px; font-weight: 600; color: #4A5372">Settings</span>
<sc-for list="{{ settings }}" as="it" hint-placeholder-count="5">
<a href="{{ it.href }}" aria-current="{{ it.current }}" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; text-decoration: none; font-size: 15px; font-weight: {{ it.weight }}; background: {{ it.bg }}; color: {{ it.ink }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ it.ink }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.icon }}"></path></svg>{{ it.label }}</a>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="padding: 0 12px 6px; font-size: 13px; font-weight: 600; color: #4A5372">Indefine</span>
<sc-for list="{{ admin }}" as="it" hint-placeholder-count="1">
<a href="{{ it.href }}" aria-current="{{ it.current }}" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; text-decoration: none; font-size: 15px; font-weight: {{ it.weight }}; background: {{ it.bg }}; color: {{ it.ink }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ it.ink }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.icon }}"></path></svg>{{ it.label }}</a>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-top: 1px solid #E3E7F0">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; background: #ECEAFF; color: #2B2390; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">PK</span>
<span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 14px">Priya K</strong><a href="Profile.dc.html" style="font-size: 12px; color: #4A5372">Profile</a></span>
<a href="#logout" style="font-size: 13px; color: #4A5372">Log out</a>
</div>
</nav>
</x-dc>
