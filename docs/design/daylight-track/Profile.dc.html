<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F5FA}
a{color:#4B3FE0}a:hover{color:#2B2390}
.d{font-family:'Archivo',Inter,system-ui,sans-serif;font-variation-settings:'wdth' 118;font-weight:800;letter-spacing:-0.02em}
.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.f input{font:inherit;font-weight:400;font-size:15px;padding:12px 14px;border-radius:14px;border:1px solid #C5CBDB;background:#FFFFFF;color:#121A33}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1100px; background: #F3F5FA; font-family: Inter, system-ui, sans-serif; color: #121A33">
<div style="flex: 0 0 248px; display: flex"><dc-import name="Sidebar" active="profile" hint-size="248px,1100px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 22px; max-width: 980px">
<div style="display: flex; align-items: center; gap: 18px">
<span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 999px; background: #ECEAFF; color: #2B2390; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px">PK</span>
<div><h1 class="d" style="margin: 0; font-size: 36px">Priya K</h1><p style="margin: 4px 0 0; font-size: 15px; color: #4A5372">Owner at Demo Runners</p></div>
</div>
<section style="background: #FFFFFF; border-radius: 28px; padding: 26px; display: flex; flex-direction: column; gap: 16px">
<div><h2 style="margin: 0; font-size: 18px">Your details</h2><p style="margin: 4px 0 0; font-size: 14px; color: #4A5372">Your name and the email you log in with.</p></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px"><label class="f">Name<input type="text" value="Priya K"></label><label class="f">Email<input type="email" value="priya@demorunners.in"></label></div>
<div style="display: flex; justify-content: flex-end"><button type="button" style="font: inherit; cursor: pointer; border: 0; background: #4B3FE0; color: #FFFFFF; padding: 13px 22px; border-radius: 999px; font-weight: 700">Save</button></div>
</section>
<section style="background: #FFFFFF; border-radius: 28px; padding: 26px; display: flex; flex-direction: column; gap: 16px">
<div><h2 style="margin: 0; font-size: 18px">Password</h2><p style="margin: 4px 0 0; font-size: 14px; color: #4A5372">Use a long password you don’t use anywhere else.</p></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px"><label class="f">Current password<input type="password"></label><label class="f">New password<input type="password"></label><label class="f">Confirm new password<input type="password"></label></div>
<div style="display: flex; justify-content: flex-end"><button type="button" style="font: inherit; cursor: pointer; border: 1px solid #C5CBDB; background: #FFFFFF; color: #121A33; padding: 12px 22px; border-radius: 999px; font-weight: 600">Change password</button></div>
</section>
<section style="background: #FFFFFF; border: 1px solid #F1C9C9; border-radius: 28px; padding: 26px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
<div style="max-width: 36rem"><h2 style="margin: 0; font-size: 18px">Delete your account</h2><p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #4A5372">This permanently removes your account and can’t be undone. You’ll be asked for your password to confirm.</p></div>
<button type="button" style="font: inherit; cursor: pointer; border: 0; background: #A12A2A; color: #FFFFFF; padding: 13px 22px; border-radius: 999px; font-weight: 700">Delete account</button>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
